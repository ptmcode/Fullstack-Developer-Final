name: school_management_app
description: "School Management System — Flutter client (GetX + http + JWT), BBU Fullstack Developer final assignment."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI / routing (GetX design pattern)
  get: ^4.6.6

  # HTTP client
  http: ^1.6.0

  # Sensitive storage for JWT tokens (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2

  # Lightweight key-value storage for preferences & cached profile
  get_storage: ^2.1.1

  # Date formatting
  intl: ^0.20.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  pdf: ^3.12.0
  excel: ^4.0.6
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  open_filex: ^4.7.0
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true