name: school_management_app
description: "School Management System — Flutter client (GetX + http + JWT), BBU Fullstack Developer final assignment."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI / routing (GetX design pattern)
  get: ^4.6.6

  # HTTP client
  http: ^1.6.0

  # Sensitive storage for JWT tokens (Keychain / Keystore)
  flutter_secure_storage: ^9.2.2

  # Lightweight key-value storage for preferences & cached profile
  get_storage: ^2.1.1

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true