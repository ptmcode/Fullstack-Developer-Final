<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — School Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div id="navbar"></div>
<div class="container pb-5"><div id="crud"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
  requireAuth();
  renderNavbar('users.html');
  initCrud({
    title: 'Users',
    api: '/users',
    perm: 'user',
    columns: [
      { key: 'username', label: 'Username' },
      { key: 'email', label: 'Email' },
      { key: 'firstName', label: 'First name' },
      { key: 'lastName', label: 'Last name' },
      { key: 'roles', label: 'Roles', render: r => (r.roles || []).map(x =>
          '<span class="badge text-bg-secondary me-1">' + esc(x.replace('ROLE_', '')) + '</span>').join('') },
      { key: 'status', label: 'Status' }
    ],
    fields: [
      { key: 'username', label: 'Username', required: true },
      { key: 'email', label: 'Email', type: 'email', required: true },
      { key: 'password', label: 'Password', type: 'password', help: 'Leave blank on edit to keep the current password' },
      { key: 'phoneNumber', label: 'Phone' },
      { key: 'firstName', label: 'First name' },
      { key: 'lastName', label: 'Last name' },
      { key: 'roles', label: 'Roles', type: 'multiselect',
        optionsLoader: async () => {
          const res = await api('/roles');
          return res.data.map(r => ({ value: r.name, label: r.name.replace('ROLE_', '') }));
        } }
    ]
  });
</script>
</body>
</html>
