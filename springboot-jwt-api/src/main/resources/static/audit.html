<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Log — School Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div id="navbar"></div>
<div class="container pb-5">
  <h4 class="mb-3">Audit Log</h4>

  <div class="row g-2 mb-3">
    <div class="col-md-3"><input class="form-control" id="f-username" placeholder="Username"></div>
    <div class="col-md-2">
      <select class="form-select" id="f-action">
        <option value="">All actions</option>
        <option>LOGIN</option><option>LOGOUT</option><option>CREATE</option><option>UPDATE</option>
        <option>DELETE</option><option>UPDATE_ROLES</option><option>CHANGE_PASSWORD</option>
        <option>FORGOT_PASSWORD</option><option>RESET_PASSWORD</option>
      </select>
    </div>
    <div class="col-md-2"><input type="date" class="form-control" id="f-from"></div>
    <div class="col-md-2"><input type="date" class="form-control" id="f-to"></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" id="btn-filter">Filter</button></div>
  </div>

  <div class="table-responsive">
    <table class="table table-sm table-hover align-middle">
      <thead class="table-light">
      <tr><th>#</th><th>User</th><th>Action</th><th>Entity</th><th>Detail</th><th>IP</th><th>When</th></tr>
      </thead>
      <tbody id="audit-body"></tbody>
    </table>
  </div>
  <div class="d-flex justify-content-between align-items-center">
    <small class="text-muted" id="audit-count"></small>
    <nav><ul class="pagination pagination-sm mb-0" id="audit-pages"></ul></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  requireAuth();
  renderNavbar('audit.html');

  const state = { page: 0, size: 15 };

  async function load() {
    const params = new URLSearchParams({
      page: state.page, size: state.size,
      username: document.getElementById('f-username').value.trim(),
      action: document.getElementById('f-action').value
    });
    const from = document.getElementById('f-from').value;
    const to = document.getElementById('f-to').value;
    if (from) params.append('from', from);
    if (to) params.append('to', to);

    try {
      const res = await api('/audit-logs?' + params.toString());
      const data = res.data;
      document.getElementById('audit-count').textContent = data.totalElements + ' entry(ies)';
      document.getElementById('audit-body').innerHTML = data.content.map(a =>
        '<tr><td class="text-muted">' + a.id + '</td><td>' + esc(a.username) + '</td>' +
        '<td><span class="badge text-bg-light border">' + esc(a.action) + '</span></td>' +
        '<td>' + esc(a.entityType || '') + (a.entityId ? ' #' + esc(a.entityId) : '') + '</td>' +
        '<td class="small text-muted">' + esc(a.detail || '') + '</td>' +
        '<td class="small">' + esc(a.ipAddress || '') + '</td>' +
        '<td class="small text-muted">' + fmtDate(a.createdAt) + '</td></tr>').join('') ||
        '<tr><td colspan="7" class="text-center text-muted py-4">No entries</td></tr>';

      const ul = document.getElementById('audit-pages');
      ul.innerHTML = '';
      for (let i = 0; i < data.totalPages; i++) {
        const li = document.createElement('li');
        li.className = 'page-item' + (i === state.page ? ' active' : '');
        li.innerHTML = '<a class="page-link" href="#">' + (i + 1) + '</a>';
        li.onclick = ev => { ev.preventDefault(); state.page = i; load(); };
        ul.appendChild(li);
      }
    } catch (err) {
      toast(errorMessage(err), false);
    }
  }

  document.getElementById('btn-filter').onclick = () => { state.page = 0; load(); };
  load();
</script>
</body>
</html>
