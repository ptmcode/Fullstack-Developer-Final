spring:
  application:
    name: school-management-system

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/school_management_db
    username: postgres
    password: 12345678

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 30033

app:
  jwt:
    secret: ebe8910a-08c0-11ed-861d-0242ac120002
    expirationMs: 900000            # access token: 15 minutes
    refreshExpirationMs: 86400000   # refresh token: 24 hours
  password-reset:
    expirationMinutes: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.school.management
  paths-to-match: /**
