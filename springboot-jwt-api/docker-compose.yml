version: '3'
services:
  school-management-api:
    container_name: school-management-api
    build: .
    ports:
      - "30033:30033"
    restart: always
    environment:
      # The containerized app reaches the host's PostgreSQL via host.docker.internal
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/school_management_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
