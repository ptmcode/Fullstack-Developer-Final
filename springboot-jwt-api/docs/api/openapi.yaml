openapi: 3.1.0
info:
  title: School Management System API
  description: |-
    REST API for the School Management System — authentication, user management, master data, enrollments, grades, push notifications (Firebase Cloud Messaging) and audit log.

    Sign in with POST /api/v1/auth/login (admin/admin@123), then click Authorize and paste the accessToken.
  contact:
    name: Sothea
    email: keoleaphy@gmail.com
  version: v1.0
servers:
- url: http://localhost:30033
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Subjects
  description: Subject master data
- name: User Management
  description: "User CRUD, role assignment, own profile"
- name: Enrollments
  description: Enroll students into classes
- name: Dashboard
  description: Summary statistics and recent activity
- name: Classes
  description: Class master data
- name: Authentication
  description: "Login, logout, token refresh and password reset"
- name: Teachers
  description: Teacher master data
- name: Roles & Permissions
  description: Role catalog and permission assignment
- name: Audit Log
  description: Search the immutable audit trail
- name: Notifications
  description: In-app notification inbox and push broadcasts
- name: Devices
  description: Register mobile devices for Firebase push notifications
- name: Grades
  description: Record and manage grades per enrollment and subject
- name: Students
  description: Student master data
paths:
  /api/v1/users/{id}:
    get:
      tags:
      - User Management
      summary: Get user by id
      description: '**Requires permission:** `user.read`'
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
    put:
      tags:
      - User Management
      summary: Update user
      description: '**Requires permission:** `user.update`'
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
