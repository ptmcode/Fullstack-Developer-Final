      tags:
      - Devices
      summary: Unregister a device
      description: Stops push delivery to the given token
      operationId: unregister
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
